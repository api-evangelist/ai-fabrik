name: Ai Fabrik
description: >-
  AI Fabrik is an infrastructure company building an edge inference delivery
  network for high-performance AI tokens. Incubated within Gruve and led by
  founder Tarun Raisoni alongside Swati Deshpande and Tanuj Mohan, the company
  has deconstructed the traditional data center model and rebuilt every layer
  for real-time AI, delivering distributed inference close to users and cloud
  providers with sub-20ms latency, cost efficiency, and built-in compliance. AI
  Fabrik is deploying five initial production sites with 6,000+ B300 GPUs
  launching in 2026, backed by Mayfield, Xora (Temasek), Acclimate Ventures, and
  Cisco Investments.
